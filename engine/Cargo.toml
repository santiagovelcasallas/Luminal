[package]
name = "luminal-quant"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "High-ratio post-training quantization engine (Hadamard rotation + mixed precision), down to 2 bits."
license = "AGPL-3.0-only"
repository = "https://github.com/santiagovelcasallas/Luminal"
authors = ["Santiago Vélez Casallas"]
keywords = ["quantization", "llm", "gptq", "hadamard", "compression"]
categories = ["science", "compression"]

[lib]
name = "luminal_quant"
# cdylib: the Python extension module. rlib: lets the Rust test/bench crates link the core.
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.10.0"
half = "2.4.1"
thiserror = "1.0.69"

[dependencies.pyo3]
version = "0.22.6"
features = ["abi3-py39"]
optional = true

[dependencies.numpy]
version = "0.22.1"
optional = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[features]
# CPU core is always built. `python` adds the PyO3 bridge (maturin enables it); `cuda` the GPU kernels.
default = []
python = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]
cuda = []
